# /etc/nginx/sites-available/pygmy.conf  →  symlink em sites-enabled/
# Um único subdomínio: o nginx separa a API (/v1, /docs) do site (todo o resto).
# Depois de ativar, rode:  sudo certbot --nginx -d pygmy.gabrielbarbosadev.com.br

server {
    listen 80;
    listen [::]:80;
    server_name pygmy.gabrielbarbosadev.com.br;

    client_max_body_size 64k;

    # ── API pública (para os seus outros projetos) ──────────────────────────
    location /v1/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /docs         { proxy_pass http://127.0.0.1:8100; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8100; proxy_set_header Host $host; }

    # ── Site (Next.js): página, demo e /admin ────────────────────────────────
    # O /admin do backend (gestão de credenciais) NÃO é roteado daqui: só o
    # container do site fala com ele, pela rede interna do Docker.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;     # sobrescreve: impede spoof de IP
        proxy_set_header X-Forwarded-Proto $scheme;        # necessário p/ cookie seguro
        proxy_set_header X-Forwarded-Host $host;
    }
}
